name: Rebuild Profile README

on:
  schedule:
    # Once a day - a personal profile doesn't need hourly freshness, and
    # fewer runs means fewer GitHub/LeetCode API calls, which matters
    # since even the authenticated GITHUB_TOKEN rate limit is shared
    # across everything the workflow does in one run.
    - cron: "0 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      crt_level:
        description: "CRT effect intensity"
        required: false
        default: "subtle"
        type: choice
        options:
          - subtle
          - medium
          - heavy
      theme:
        description: "Badge color theme"
        required: false
        default: "cyberpunk"
        type: choice
        options:
          - cyberpunk
          - crt
          - hacker
          - minimal
          - matrix

# contents: write isn't actually needed for pushing anymore - the deploy
# step pushes to a different repo using its own PROFILE_DEPLOY_TOKEN, not
# this repo's GITHUB_TOKEN. Left in case build.py or a future step ever
# needs to write back to this repo directly.
permissions:
  contents: write

# If a push and the schedule fire close together, don't let two rebuilds
# race each other to commit/push - only the latest run matters, so cancel
# any run that's still in progress when a newer one starts.
concurrency:
  group: profile-rebuild
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch runs can override the intensity; scheduled/push
          # runs fall back to build.py's own default ("subtle") since the
          # input doesn't exist on those triggers.
          CRT_LEVEL: ${{ inputs.crt_level }}
          THEME: ${{ inputs.theme }}
        run: python scripts/build.py

      - name: Deploy generated README to profile repo
        env:
          # A separate PAT, NOT secrets.GITHUB_TOKEN - the default token is
          # scoped to only this repo (profile-engine) and can't push to a
          # different one. Create a classic PAT with the "repo" scope (or a
          # fine-grained token scoped to just Eddy-Odero/Eddy-Odero with
          # Contents: read-and-write), then add it as a repository secret
          # here named PROFILE_DEPLOY_TOKEN (Settings -> Secrets and
          # variables -> Actions -> New repository secret).
          DEPLOY_TOKEN: ${{ secrets.PROFILE_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "profile-bot"
          git config --global user.email "profile-bot@users.noreply.github.com"

          # Clone the actual profile repo into a separate directory -
          # this workflow's own checkout (profile-engine) is left
          # untouched, since these two repos are staying separate.
          git clone "https://x-access-token:${DEPLOY_TOKEN}@github.com/Eddy-Odero/Eddy-Odero.git" /tmp/profile-repo

          # Mirror just the rendered output - README.md and the SVGs it
          # references - not the generator's source code. rm+cp (rather
          # than only overwriting existing files) means a project that
          # gets removed from PROJECTS here also disappears from the
          # deployed repo instead of leaving a stale orphaned SVG behind.
          cp README.md /tmp/profile-repo/README.md
          rm -rf /tmp/profile-repo/generated
          cp -r generated /tmp/profile-repo/generated

          cd /tmp/profile-repo
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-update README from profile-engine"
          git pull --rebase origin main
          git push
