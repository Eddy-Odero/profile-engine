<svg width="820" height="202" viewBox="0 0 820 202" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LeetCode stats">
  <defs>
    <pattern id="hudgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FF38F8" stroke-width="0.6" opacity="0.09"/>
    </pattern>
    <pattern id="hudgridbold" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FF38F8" stroke-width="1" opacity="0.162"/>
    </pattern>
    <filter id="hudglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="black" fill-opacity="0.15"/>
    </pattern></defs>
  <rect width="820" height="202" fill="#07090F"/>
  <rect width="820" height="202" rx="0" fill="url(#hudgrid)"/><rect width="820" height="202" rx="0" fill="url(#hudgridbold)"/>
  <rect width="4" height="202" fill="#FF38F8"/>
  <text x="28" y="26" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">SOLVED</text><text x="218" y="26" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">120 (E55 / M50 / H15)</text><text x="28" y="50" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">RATING</text><text x="218" y="50" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">unrated</text><text x="28" y="74" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">GLOBAL_RANK</text><text x="218" y="74" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">N/A</text><text x="28" y="98" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">TOP_PERCENT</text><text x="218" y="98" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">N/A</text><text x="28" y="122" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">CONTESTS</text><text x="218" y="122" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">0</text><text x="28" y="146" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a7fa8" letter-spacing="0.5">BADGES</text><text x="218" y="146" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#e8e6f0">none yet</text>
  
  <rect x="0" y="0" width="820" height="202" fill="url(#scanlines)"/>
