<svg width="820" height="336" viewBox="0 0 820 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event log">
  <defs>
    <pattern id="hudgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FF4D5A" stroke-width="0.6" opacity="0.09"/>
    </pattern>
    <pattern id="hudgridbold" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#FF4D5A" stroke-width="1" opacity="0.162"/>
    </pattern>
    <filter id="hudglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="black" fill-opacity="0.15"/>
    </pattern>
    <linearGradient id="eventglassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D5A" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#FF4D5A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF4D5A" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="eventglassSheen" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="eventglassClip">
      <rect width="820" height="336" rx="16"/>
    </clipPath></defs>
  <rect width="820" height="336" rx="16" fill="#07090F" fill-opacity="0.97"/>
  <rect width="820" height="336" rx="16" fill="url(#hudgrid)"/><rect width="820" height="336" rx="16" fill="url(#hudgridbold)"/>
  <line x1="44" y1="36" x2="44" y2="306" stroke="#FF4D5A" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="44" cy="38" r="5" fill="#FF4D5A" filter="url(#hudglow)"/><circle cx="44" cy="38" r="8" fill="none" stroke="#FF4D5A" stroke-width="1" stroke-opacity="0.4"/><text x="70" y="42" font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b6478">2026.07.15 -- 09:00 UTC</text><text x="70" y="58" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#e8e6f0">Won Kisumu Bitcoin Bootcamp Hackathon 2026</text><text x="70" y="78" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">Built SatGate, a Lightning Network-powered anti-spam gate, with a 7-person</text><text x="70" y="94" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">team.</text><circle cx="44" cy="130" r="5" fill="#FF4D5A" filter="url(#hudglow)"/><circle cx="44" cy="130" r="8" fill="none" stroke="#FF4D5A" stroke-width="1" stroke-opacity="0.4"/><text x="70" y="134" font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b6478">2026.06.20 -- 18:00 UTC</text><text x="70" y="150" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#e8e6f0">Go Forum: Auth System Shipped</text><text x="70" y="170" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">Phase 4 complete - bcrypt auth, UUID sessions, WithUser middleware,</text><text x="70" y="186" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">RequireAuth guard.</text><circle cx="44" cy="222" r="5" fill="#FF4D5A" filter="url(#hudglow)"/><circle cx="44" cy="222" r="8" fill="none" stroke="#FF4D5A" stroke-width="1" stroke-opacity="0.4"/><text x="70" y="226" font-family="Consolas, Menlo, monospace" font-size="11" fill="#6b6478">2026.05.10 -- 12:00 UTC</text><text x="70" y="242" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700" fill="#e8e6f0">EDU-FLIX Deployed</text><text x="70" y="262" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">Netflix-style streaming app shipped to Render with JWT auth and role-based</text><text x="70" y="278" font-family="Consolas, Menlo, monospace" font-size="11" fill="#8a8494">access.</text>
  <rect x="0" y="0" width="820" height="336" fill="url(#scanlines)"/>
