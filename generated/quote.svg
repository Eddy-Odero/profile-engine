<svg width="490" height="104" viewBox="0 0 490 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quote">
  <defs>
    <clipPath id="reveal0">
      <rect x="0" y="10" width="0" height="30">
        <animate attributeName="width" values="0;0;410.7;410.7;0" keyTimes="0;0.000;0.300;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="reveal1">
      <rect x="0" y="36" width="0" height="30">
        <animate attributeName="width" values="0;0;53.6;53.6;0" keyTimes="0;0.300;0.600;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <pattern id="hudgrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00E7FF" stroke-width="0.6" opacity="0.09"/>
    </pattern>
    <pattern id="hudgridbold" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#00E7FF" stroke-width="1" opacity="0.162"/>
    </pattern>
    <filter id="hudglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="black" fill-opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="490" height="104" rx="10" fill="#07090F" fill-opacity="0.6"/>
  <rect width="490" height="104" rx="10" fill="url(#hudgrid)"/><rect width="490" height="104" rx="10" fill="url(#hudgridbold)"/>
  <rect width="490" height="104" rx="10" fill="none" stroke="#1c2a3a" stroke-width="1"/>
  <rect width="4" height="104" fill="#00E7FF"/>
  <text x="22" y="42" font-family="Consolas, Menlo, monospace" font-size="38" fill="#00E7FF" fill-opacity="0.4" filter="url(#hudglow)">&#8220;</text>
  <text x="54" y="38" clip-path="url(#reveal0)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e8e6f0">First, solve the problem. Then, write the</text><text x="54" y="64" clip-path="url(#reveal1)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#e8e6f0">code.</text>
  <rect x="103.6" y="51" width="2.5" height="18" fill="#00E7FF" filter="url(#hudglow)">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.770;0.780;0.92;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="490" height="104" fill="url(#scanlines)"/>
</svg>