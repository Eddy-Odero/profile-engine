  <text x="22" y="42" font-family="Consolas, Menlo, monospace" font-size="38" fill="#FF2279" fill-opacity="0.5">&#8220;</text>
  <text x="54" y="38" clip-path="url(#reveal0)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1f">Programs must be written for people to read,</text><text x="54" y="64" clip-path="url(#reveal1)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1f">and only incidentally for machines to execute.</text>
  <rect x="510.3" y="51" width="2.5" height="18" fill="#FF2279">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.770;0.780;0.92;1" dur="7s" repeatCount="indefinite"/>
  </rect>
