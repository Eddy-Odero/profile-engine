  <text x="54" y="38" clip-path="url(#reveal0)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1f">There are only two hard things in computer</text><text x="54" y="64" clip-path="url(#reveal1)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1f">science: cache invalidation, naming things,</text><text x="54" y="90" clip-path="url(#reveal2)" font-family="Consolas, Menlo, monospace" font-size="16" fill="#1a1a1f">and off-by-one errors.</text>
