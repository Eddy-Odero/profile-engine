<svg width="540" height="104" viewBox="0 0 540 104" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Quote">
  <defs>
    <clipPath id="reveal0">
      <rect x="0" y="10" width="0" height="30">
        <animate attributeName="width" values="0;0;440.5;440.5;0" keyTimes="0;0.000;0.300;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="reveal1">
      <rect x="0" y="36" width="0" height="30">
        <animate attributeName="width" values="0;0;460.3;460.3;0" keyTimes="0;0.300;0.600;0.92;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="540" height="104" rx="10" fill="#ffffff"/>
  <rect width="540" height="104" rx="10" fill="none" stroke="#e5e5ea" stroke-width="1"/>
